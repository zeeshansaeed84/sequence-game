<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequence — Debug Log Viewer</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root {
    --navy-dark: #0b0e2e; --navy-mid: #141a44; --gold: #d4b830; --gold-light: #f0dc90;
    --cream: #f5f0e8; --red: #c0202a; --green: #2a8a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at top, var(--navy-mid), var(--navy-dark));
    color: var(--cream); min-height: 100vh; padding: 20px;
  }
  h1 { font-size: 1.4em; margin: 0 0 4px; color: var(--gold-light); }
  .sub { opacity: 0.7; font-size: 0.85em; margin-bottom: 20px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1; min-width: 200px; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); color: var(--cream); font-size: 1em; letter-spacing: 1px;
  }
  input[type=text]::placeholder { color: rgba(245,240,232,0.4); }
  button {
    padding: 12px 20px; border-radius: 10px; border: none; background: var(--gold); color: var(--navy-dark);
    font-weight: 700; cursor: pointer; font-size: 0.95em;
  }
  button:hover { background: var(--gold-light); }
  .status { opacity: 0.7; font-size: 0.9em; margin-bottom: 12px; }
  .client-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .client-chip {
    padding: 4px 10px; border-radius: 20px; font-size: 0.8em; font-weight: 600;
    border: 1px solid currentColor;
  }
  .timeline { display: flex; flex-direction: column; gap: 6px; }
  .event-row {
    background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px 14px;
    border-left: 4px solid var(--gold); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  }
  .event-row.host-event { border-left-color: var(--green); }
  .event-row.warn-event { border-left-color: var(--red); }
  .ts { font-size: 0.78em; opacity: 0.6; white-space: nowrap; min-width: 130px; }
  .client-badge { font-size: 0.78em; font-weight: 700; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
  .event-name { font-weight: 700; font-size: 0.92em; }
  .details { font-size: 0.82em; opacity: 0.75; font-family: 'SF Mono', Consolas, monospace; word-break: break-all; }
  .host-tag { font-size: 0.7em; background: var(--green); color: white; padding: 1px 6px; border-radius: 8px; }
  .empty { text-align: center; padding: 60px 20px; opacity: 0.6; }
  .actions-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .actions-row button { background: rgba(255,255,255,0.12); color: var(--cream); }
  .actions-row button:hover { background: rgba(255,255,255,0.2); }
  #copy-fallback {
    display: none; width: 100%; height: 200px; margin-top: 10px; padding: 10px;
    background: rgba(0,0,0,0.3); color: var(--cream); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px; font-family: 'SF Mono', Consolas, monospace; font-size: 0.78em;
  }
</style>
</head>
<body>

<h1>Sequence — Multiplayer Debug Log</h1>
<div class="sub">Enter a room code to see the full, chronological, multi-device event timeline for that game.</div>

<div class="search-row">
  <input type="text" id="room-code-input" placeholder="ROOM CODE (e.g. GE9SLV)" maxlength="6" autocapitalize="characters">
  <button onclick="loadLog()">Load</button>
</div>
<div class="sub" style="margin-top:-12px">
  Heard a sound with no game open? <a href="#" onclick="browseLobbyDevices(); return false;" style="color:var(--gold-light)">Browse recent activity instead</a> — no room code needed.
</div>

<div id="status" class="status"></div>
<div id="device-list" class="timeline" style="margin-bottom:16px"></div>
<div id="actions-row" class="actions-row" style="display:none">
  <button id="copy-btn" onclick="copyAsText()">📋 Copy as Text (paste into chat)</button>
</div>
<textarea id="copy-fallback" readonly></textarea>
<div id="legend" class="client-legend"></div>
<div id="timeline" class="timeline"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDNTc973eY-dt1UQSJqs0kCTLAZF14xuG4",
  databaseURL: "https://sequence-game-5a793-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let loadedEvents = [];
let loadedSourceLabel = '';

const CLIENT_COLORS = ['#d4b830', '#61AF41', '#AE42D0', '#1E90FF', '#e07840', '#40c0c0'];
const clientColorMap = {};
function colorFor(clientKey) {
  if (!clientColorMap[clientKey]) {
    clientColorMap[clientKey] = CLIENT_COLORS[Object.keys(clientColorMap).length % CLIENT_COLORS.length];
  }
  return clientColorMap[clientKey];
}

function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
}

const WARN_EVENTS = new Set(['turn_timer_fired_stale', 'host_migration_threw', 'rematch_cancelled', 'sound_priming_rejected']);
const HOST_EVENTS = new Set(['became_host', 'stepped_down_as_host', 'host_migration_attempted', 'host_migration_result', 'hostid_observed']);
const SOUND_EVENTS = new Set(['play_sound_called', 'sound_priming_started', 'sound_priming_completed', 'sound_priming_rejected']);

// Shared rendering for both a room's log and a device's lobby-level log -
// same timeline format either way, just a different data source and header.
function renderEvents(events, sourceLabel) {
  const statusEl = document.getElementById('status');
  const timelineEl = document.getElementById('timeline');
  const legendEl = document.getElementById('legend');
  const actionsEl = document.getElementById('actions-row');

  loadedEvents = events;
  loadedSourceLabel = sourceLabel;

  if (!events.length) {
    statusEl.textContent = 'No events found.';
    timelineEl.innerHTML = '<div class="empty">Nothing logged here yet.</div>';
    actionsEl.style.display = 'none';
    return;
  }

  statusEl.textContent = events.length + ' events · ' + sourceLabel;
  actionsEl.style.display = 'flex';

  const seenClients = new Set();
  events.forEach(e => seenClients.add((e.myName || e.myId || 'unknown')));
  legendEl.innerHTML = Array.from(seenClients).map(name => {
    const c = colorFor(name);
    return `<span class="client-chip" style="color:${c}">${escapeHtml(name)}</span>`;
  }).join('');

  const startTs = events[0].ts;
  timelineEl.innerHTML = events.map(e => {
    const clientKey = e.myName || e.myId || 'unknown';
    const color = colorFor(clientKey);
    const rowClass = WARN_EVENTS.has(e.event) ? 'warn-event' : (HOST_EVENTS.has(e.event) || SOUND_EVENTS.has(e.event) ? 'host-event' : '');
    const relMs = e.ts - startTs;
    const detailsStr = e.details && Object.keys(e.details).length ? JSON.stringify(e.details) : '';
    return `
      <div class="event-row ${rowClass}">
        <span class="ts">${fmtTime(e.ts)} <span style="opacity:0.5">(+${relMs}ms)</span></span>
        <span class="client-badge" style="background:${color}22;color:${color};border:1px solid ${color}">${escapeHtml(clientKey)}</span>
        ${e.isHost ? '<span class="host-tag">HOST</span>' : ''}
        ${e.inRoom === false ? '<span class="host-tag" style="background:#555">NO ROOM</span>' : ''}
        <span class="event-name">${escapeHtml(e.event)}</span>
        <span class="details">${escapeHtml(detailsStr)}</span>
      </div>`;
  }).join('');
}

function resetView() {
  document.getElementById('timeline').innerHTML = '';
  document.getElementById('legend').innerHTML = '';
  document.getElementById('device-list').innerHTML = '';
  document.getElementById('actions-row').style.display = 'none';
  document.getElementById('copy-fallback').style.display = 'none';
  Object.keys(clientColorMap).forEach(k => delete clientColorMap[k]);
  loadedEvents = [];
}

async function loadLog() {
  const code = document.getElementById('room-code-input').value.trim().toUpperCase();
  const statusEl = document.getElementById('status');
  resetView();

  if (code.length !== 6) { statusEl.textContent = 'Enter a valid 6-character room code.'; return; }
  statusEl.textContent = 'Loading…';

  try {
    const snap = await db.ref('sq_debug_log/' + code).once('value');
    const val = snap.val();
    if (!val) {
      statusEl.textContent = 'No debug log found for this room code.';
      document.getElementById('timeline').innerHTML = '<div class="empty">Nothing logged for this room yet — or the room code doesn\'t match a game that used the diagnostic log.</div>';
      return;
    }
    const events = Object.values(val).sort((a, b) => a.ts - b.ts);
    renderEvents(events, 'room ' + code);
  } catch (err) {
    statusEl.textContent = 'Error loading log: ' + err.message;
  }
}

// Lists devices that have logged something outside any room (e.g. the
// audio-priming cycle, which can fire purely from opening the app) -
// sorted most-recently-active first, since there are typically only a
// handful of devices being tested with at any given time.
async function browseLobbyDevices() {
  const statusEl = document.getElementById('status');
  const deviceListEl = document.getElementById('device-list');
  resetView();
  statusEl.textContent = 'Loading recent activity…';

  try {
    const snap = await db.ref('sq_debug_log_lobby').once('value');
    const val = snap.val();
    if (!val) {
      statusEl.textContent = 'No lobby-level activity logged yet.';
      return;
    }
    const devices = Object.entries(val).map(([deviceId, events]) => {
      const list = Object.values(events);
      const latest = list.reduce((max, e) => Math.max(max, e.ts || 0), 0);
      const name = list.slice().sort((a,b) => b.ts - a.ts)[0]?.myName || deviceId;
      return { deviceId, count: list.length, latest, name };
    }).sort((a, b) => b.latest - a.latest);

    statusEl.textContent = devices.length + ' device(s) with lobby-level activity';
    deviceListEl.innerHTML = devices.map(d => `
      <div class="event-row" style="cursor:pointer" onclick="loadLobbyDeviceLog('${escapeHtml(d.deviceId)}')">
        <span class="event-name">${escapeHtml(d.name)}</span>
        <span class="details">${d.count} events · last activity ${fmtTime(d.latest)}</span>
      </div>`).join('');
  } catch (err) {
    statusEl.textContent = 'Error loading devices: ' + err.message;
  }
}

async function loadLobbyDeviceLog(deviceId) {
  const statusEl = document.getElementById('status');
  resetView();
  statusEl.textContent = 'Loading…';
  try {
    const snap = await db.ref('sq_debug_log_lobby/' + deviceId).once('value');
    const val = snap.val();
    if (!val) { statusEl.textContent = 'No events found for this device.'; return; }
    const events = Object.values(val).sort((a, b) => a.ts - b.ts);
    renderEvents(events, 'device ' + deviceId + ' (no room)');
  } catch (err) {
    statusEl.textContent = 'Error loading log: ' + err.message;
  }
}

// Builds a clean, plain-text chronological dump - designed to be pasted
// directly into a chat conversation, not just read on-screen. One event
// per line, fixed-width-ish fields, full details included (nothing
// truncated the way a screenshot's off-screen content would be).
function buildTextExport() {
  if (!loadedEvents.length) return '';
  const startTs = loadedEvents[0].ts;
  const lines = [
    'SEQUENCE DEBUG LOG — ' + loadedSourceLabel + ' — ' + loadedEvents.length + ' events',
    'Generated ' + new Date().toLocaleString(),
    '',
  ];
  loadedEvents.forEach(e => {
    const clientKey = e.myName || e.myId || 'unknown';
    const relMs = e.ts - startTs;
    const detailsStr = e.details && Object.keys(e.details).length ? JSON.stringify(e.details) : '{}';
    const hostTag = e.isHost ? '[HOST]' : '      ';
    lines.push(
      '+' + String(relMs).padStart(7, ' ') + 'ms  ' +
      fmtTime(e.ts) + '  ' +
      hostTag + '  ' +
      clientKey.padEnd(12, ' ') + '  ' +
      e.event.padEnd(28, ' ') + '  ' +
      detailsStr
    );
  });
  return lines.join('\n');
}

async function copyAsText() {
  const text = buildTextExport();
  const btn = document.getElementById('copy-btn');
  const fallback = document.getElementById('copy-fallback');
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = '✓ Copied — paste into chat now';
    setTimeout(() => { btn.textContent = '📋 Copy as Text (paste into chat)'; }, 3000);
  } catch (err) {
    // Clipboard API unavailable in this context - show a selected textarea instead,
    // so the text can still be copied manually (Cmd/Ctrl+C, or long-press on mobile)
    fallback.style.display = 'block';
    fallback.value = text;
    fallback.focus();
    fallback.select();
    btn.textContent = '↓ Select the text below and copy it manually';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('room-code-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadLog();
});
</script>

</body>
</html>
